{% extends "base.html" %}{% block content %}
<div class="title-row"><h1>العملاء</h1><a class="btn" href="/clients/add">+ إضافة عميل</a></div>
<form class="search"><input name="q" value="{{q}}" placeholder="ابحث بالاسم أو الجواز أو الهاتف"><button>بحث</button></form>
<table><tr><th>الاسم</th><th>الجواز</th><th>الهاتف</th><th>تاريخ الإضافة</th></tr>
{% for c in clients %}<tr><td>{{c.name}}</td><td>{{c.passport or '-'}}</td><td>{{c.phone or '-'}}</td><td>{{c.created_at[:10]}}</td></tr>{% else %}<tr><td colspan="4">لا يوجد عملاء</td></tr>{% endfor %}</table>
{% endblock %}
