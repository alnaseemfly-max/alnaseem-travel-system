{% extends 'base.html' %}{% block page_heading %}{{ 'تعديل عميل' if client else 'إضافة عميل' }}{% endblock %}{% block content %}<div class="title-row"><div><span class="eyebrow">بيانات العملاء</span><h2>{{ 'تعديل بيانات العميل' if client else 'إضافة عميل جديد' }}</h2></div><a class="btn secondary" href="{{ url_for('clients') }}">العودة للعملاء</a></div><form class="form-card" method="post"><div class="form-grid"><div class="field"><label>الاسم الكامل *</label><input name="name" required value="{{ client.name if client else '' }}" placeholder="مثال: محمد أحمد"></div><div class="field"><label>رقم الجواز</label><input name="passport" value="{{ client.passport if client else '' }}" placeholder="رقم الجواز"></div><div class="field"><label>رقم الهاتف</label><input name="phone" value="{{ client.phone if client else '' }}" placeholder="05xxxxxxxx"></div><div class="field full"><label>ملاحظات</label><textarea name="notes" placeholder="أي ملاحظات إضافية">{{ client.notes if client else '' }}</textarea></div></div><div class="form-actions"><button class="btn" type="submit">حفظ البيانات</button><a class="btn secondary" href="{{ url_for('clients') }}">إلغاء</a></div></form>{% endblock %}
