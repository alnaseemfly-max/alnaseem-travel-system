{% extends "base.html" %}{% block content %}<h1>إضافة معاملة</h1>
<form class="form" method="post"><label>العميل<select name="client_id" required><option value="">اختر العميل</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}} — {{c.passport or 'بدون جواز'}}</option>{% endfor %}</select></label>
<label>الخدمة<select name="service"><option>تأشيرة عمرة</option><option>تأشيرة زيارة</option><option>تأشيرة عمل</option><option>حجز طيران</option><option>حجز باص</option><option>أخرى</option></select></label>
<label>الحالة<select name="status"><option>قيد الإجراء</option><option>تمت</option><option>مرفوضة</option><option>ملغاة</option></select></label>
<label>رقم الطلب/التأشيرة<input name="application_no"></label>
<div class="grid"><label>تاريخ الإصدار<input type="date" name="issue_date"></label><label>الدخول<input type="date" name="entry_date"></label><label>الخروج<input type="date" name="exit_date"></label></div>
<div class="grid"><label>الإجمالي<input type="number" step="0.01" name="total"></label><label>المدفوع<input type="number" step="0.01" name="paid"></label><label>المصروف<input type="number" step="0.01" name="expenses"></label></div>
<label>ملاحظات<textarea name="notes"></textarea></label><button class="btn">حفظ المعاملة</button></form>{% endblock %}
