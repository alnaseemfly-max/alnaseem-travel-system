{% extends 'base.html' %}{% block page_heading %}{{ 'تعديل معاملة' if transaction else 'إضافة معاملة' }}{% endblock %}{% block content %}<div class="title-row"><div><span class="eyebrow">التأشيرات والخدمات</span><h2>{{ 'تعديل بيانات المعاملة' if transaction else 'إضافة معاملة جديدة' }}</h2></div><a class="btn secondary" href="{{ url_for('transactions') }}">العودة للمعاملات</a></div><form class="form-card" method="post"><div class="form-grid"><div class="field"><label>العميل *</label><select name="client_id" required><option value="">اختر العميل</option>{% for c in clients %}<option value="{{ c.id }}" {% if transaction and transaction.client_id==c.id %}selected{% endif %}>{{ c.name }} — {{ c.passport or 'بدون جواز' }}</option>{% endfor %}</select></div><div class="field"><label>الخدمة *</label><select name="service">{% for s in ['تأشيرة عمرة','تأشيرة زيارة','تأشيرة عمل','حجز طيران','حجز باص','أخرى'] %}<option {% if transaction and transaction.service==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="field"><label>الحالة</label><select name="status">{% for s in statuses %}<option {% if transaction and transaction.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="field"><label>رقم الطلب / التأشيرة</label><input name="application_no" value="{{ transaction.application_no if transaction else '' }}"></div><div class="field"><label>تاريخ الإصدار</label><input type="date" name="issue_date" value="{{ transaction.issue_date if transaction else '' }}"></div><div class="field"><label>تاريخ الدخول</label><input type="date" name="entry_date" value="{{ transaction.entry_date if transaction else '' }}"></div><div class="field"><label>تاريخ الخروج</label><input type="date" name="exit_date" value="{{ transaction.exit_date if transaction else '' }}"></div><div class="field"><label>الإجمالي</label><input type="number" min="0" step="0.01" name="total" value="{{ transaction.total if transaction else '' }}"></div><div class="field"><label>المدفوع</label><input type="number" min="0" step="0.01" name="paid" value="{{ transaction.paid if transaction else '' }}"></div><div class="field"><label>المصروف</label><input type="number" min="0" step="0.01" name="expenses" value="{{ transaction.expenses if transaction else '' }}"></div><div class="field full"><label>ملاحظات</label><textarea name="notes">{{ transaction.notes if transaction else '' }}</textarea></div></div><div class="form-actions"><button class="btn" type="submit">حفظ المعاملة</button><a class="btn secondary" href="{{ url_for('transactions') }}">إلغاء</a></div></form>{% endblock %}
