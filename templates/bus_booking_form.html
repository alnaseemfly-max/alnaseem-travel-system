{% extends 'base.html' %}{% block page_heading %}{{ 'تعديل حجز باص' if booking else 'إضافة حجز باص' }}{% endblock %}{% block content %}<div class="title-row"><div><span class="eyebrow">الرحلات والنقل</span><h2>{{ 'تعديل بيانات الحجز' if booking else 'إنشاء حجز باص جديد' }}</h2></div><a class="btn secondary" href="{{ url_for('bus_bookings') }}">العودة للحجوزات</a></div><form class="form-card" method="post"><div class="form-grid"><div class="field"><label>العميل *</label><select name="client_id" required><option value="">اختر العميل</option>{% for c in clients %}<option value="{{ c.id }}" {% if booking and booking.client_id==c.id %}selected{% endif %}>{{ c.name }} — {{ c.passport or 'بدون جواز' }}</option>{% endfor %}</select></div><div class="field"><label>شركة النقل</label><select name="company">{% for c in bus_companies %}<option {% if booking and booking.company==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="field"><label>رقم الحجز</label><input name="booking_no" value="{{ booking.booking_no if booking else '' }}"></div><div class="field"><label>من</label><input name="from_city" value="{{ booking.from_city if booking else '' }}" placeholder="مدينة المغادرة"></div><div class="field"><label>إلى</label><input name="to_city" value="{{ booking.to_city if booking else '' }}" placeholder="مدينة الوصول"></div><div class="field"><label>تاريخ السفر</label><input type="date" name="travel_date" value="{{ booking.travel_date if booking else '' }}"></div><div class="field"><label>عدد المقاعد</label><input type="number" min="1" name="seats" value="{{ booking.seats if booking else 1 }}"></div><div class="field"><label>الإجمالي</label><input type="number" min="0" step="0.01" name="total" value="{{ booking.total if booking else '' }}"></div><div class="field"><label>المدفوع</label><input type="number" min="0" step="0.01" name="paid" value="{{ booking.paid if booking else '' }}"></div><div class="field"><label>الحالة</label><select name="status">{% for s in statuses %}<option {% if booking and booking.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="field full"><label>ملاحظات</label><textarea name="notes">{{ booking.notes if booking else '' }}</textarea></div></div><div class="form-actions"><button class="btn" type="submit">حفظ الحجز</button><a class="btn secondary" href="{{ url_for('bus_bookings') }}">إلغاء</a></div></form>{% endblock %}
