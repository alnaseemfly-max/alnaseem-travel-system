<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النسيم للسفريات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 col-sm-10">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="النسيم للسفريات" class="img-fluid mb-3" style="max-height: 80px;" onerror="this.style.display='none'">
                        <h4 class="mb-4">تسجيل الدخول</h4>

                        {% with messages = get_flashed_messages() %}
                          {% if messages %}
                            {% for msg in messages %}
                              <div class="alert alert-danger py-2 mb-3">{{ msg }}</div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3 text-start">
                                <label class="form-label">اسم المستخدم</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3 text-start">
                                <label class="form-label">كلمة المرور</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">دخول</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
